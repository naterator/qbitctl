version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      charm:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
      supply-chain:
        patterns:
          - "github.com/sigstore/*"
          - "github.com/theupdateframework/*"
          - "github.com/secure-systems-lab/*"
      golang-x:
        patterns:
          - "golang.org/x/*"
