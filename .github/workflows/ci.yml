name: CI

on:
  # Tag pushes are not listed: the release workflow waits for this workflow's
  # push run on main for the tagged commit, so rerunning it for the tag only
  # repeated work. Other branches are covered by their pull requests.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Cancel superseded pull request runs. Main runs are never canceled, because
# each commit that may be tagged needs a completed run for the release gate.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job restores its own Go build and module cache (.github/actions/setup-go).
# Only main saves caches, and only when the exact key missed, so a cache is
# written once per dependency or Go version change. Pull requests read main's
# caches but never write their own.

jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QBITCTL_MASTER_KEY: ci-only-test-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: go
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-go
        with:
          cache-name: native-${{ runner.os == 'macOS' && 'macos' || 'linux' }}
      - id: windows-go
        if: runner.os == 'Windows'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Report Go cache result
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            echo 'Go cache: disabled on Windows' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Go cache exact hit: ${{ steps.go.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check formatting, tests, smoke, and release helpers on Unix
        if: runner.os != 'Windows'
        run: make ci
      - name: Exercise the installer on macOS
        if: runner.os == 'macOS'
        run: sh scripts/test_install.sh
      - name: Check tests and smoke on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go vet ./...
          go test -race ./...
          go build -trimpath -o qbitctl-smoke.exe ./cmd/qbitctl
          python scripts/smoke_native.py ./qbitctl-smoke.exe
          bash scripts/test_release_helpers.sh
          bash scripts/test_release_targets.sh
      - name: Save Go cache
        if: runner.os != 'Windows' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  compatibility:
    name: qBittorrent compatibility (${{ matrix.version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official Docker Hub manifests, pinned by digest. The tags remain
          # visible for auditability while the digest makes each job
          # reproducible on the amd64 GitHub-hosted runner.
          - version: 5.0.0
            image: qbittorrentofficial/qbittorrent-nox:5.0.0-1@sha256:03c968cd9d82c92a90b6ddde6c9a7a4093cf072c329090815c355dabeadd1fc9
          - version: 5.2.4
            image: qbittorrentofficial/qbittorrent-nox:5.2.4-1@sha256:92bfd78d731e254ba64f62b77b0696add6447a33642ee5feda106a26b285aa7f
          - version: 5.3.0
            image: qbittorrentofficial/qbittorrent-nox:5.3.0-2@sha256:43b2d352cf76330a7ca34c7320b9b74227d6f31e662e0e123d0457206b09a7ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: ./.github/actions/setup-go
        with:
          # Both legs build the same binary, so they share one cache.
          cache-name: compatibility
      - name: Report Go cache result
        if: always()
        run: |
          echo 'Go cache exact hit: ${{ steps.go.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Build compatibility binary
        run: go build -trimpath -o "$RUNNER_TEMP/qbitctl-compat" ./cmd/qbitctl
      - name: Exercise real qBittorrent API
        run: |
          python3 scripts/integration_qbittorrent.py \
            --binary "$RUNNER_TEMP/qbitctl-compat" \
            --image '${{ matrix.image }}' \
            --version '${{ matrix.version }}'
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' && matrix.version == '5.3.0'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  # Release binaries are built only by the release workflow. CI type-checks
  # each release OS instead, which catches platform-specific breakage
  # without linking 17 binaries on every push.
  cross-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: ./.github/actions/setup-go
        with:
          cache-name: cross-check
      - name: Report Go cache result
        if: always()
        run: |
          echo 'Go cache exact hit: ${{ steps.go.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Type-check every release operating system
        run: bash scripts/check_cross_targets.sh
      - name: Check and exercise the installer
        run: |
          shellcheck scripts/install.sh scripts/test_install.sh scripts/check_cross_targets.sh scripts/lint_actions.sh scripts/check_commit_hygiene.sh scripts/test_commit_hygiene.sh scripts/check_go_toolchain.sh scripts/hooks/commit-msg
          sh scripts/test_install.sh
          bash scripts/test_commit_hygiene.sh
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: ./.github/actions/setup-go
        with:
          cache-name: govulncheck
      - name: Report Go cache result
        if: always()
        run: |
          echo 'Go cache exact hit: ${{ steps.go.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  workflow-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: ./.github/actions/setup-go
        with:
          cache-name: workflow-lint
      - name: Report Go cache result
        if: always()
        run: |
          echo 'Go cache exact hit: ${{ steps.go.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate composite action shell
        run: scripts/lint_actions.sh
      - name: Test scheduled vulnerability reporting
        run: bash scripts/test_govulncheck.sh
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  commit-hygiene:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit messages and signatures
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: bash scripts/check_commit_hygiene.sh

  ci-summary:
    if: always()
    needs: [native, compatibility, cross-check, govulncheck, workflow-lint, commit-hygiene]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Summarize CI jobs and durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > "$RUNNER_TEMP/ci-jobs.json"
          python3 - "$RUNNER_TEMP/ci-jobs.json" <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          data = json.loads(Path(os.environ["RUNNER_TEMP"], "ci-jobs.json").read_text())
          slow = []
          lines = ["### CI job summary", "", "| Job | Result | Duration |", "| --- | --- | ---: |"]
          for job in data.get("jobs", []):
              started = datetime.fromisoformat(job["startedAt"].replace("Z", "+00:00"))
              completed = job.get("completedAt")
              if completed:
                  seconds = int((datetime.fromisoformat(completed.replace("Z", "+00:00")) - started).total_seconds())
              else:
                  seconds = 0
              if seconds > 180:
                  slow.append(job["name"])
              minutes, remainder = divmod(seconds, 60)
              duration = f"{minutes}m {remainder:02d}s"
              lines.append(f"| {job['name']} | {job.get('conclusion') or 'in progress'} | {duration} |")
          if slow:
              lines.extend(["", ":warning: Jobs over the three-minute budget: " + ", ".join(slow)])
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")
          PY
