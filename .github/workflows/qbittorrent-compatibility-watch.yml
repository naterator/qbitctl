name: qBittorrent compatibility watch

on:
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      newer: ${{ steps.versions.outputs.newer }}
      tag: ${{ steps.versions.outputs.tag }}
      image: ${{ steps.versions.outputs.image }}
      digest: ${{ steps.versions.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        name: Check Docker Hub for a newer qBittorrent image
        shell: bash
        run: |
          python3 scripts/check_qbittorrent_releases.py \
            --workflow .github/workflows/ci.yml \
            --github-output | tee "$RUNNER_TEMP/qbittorrent-version-check.txt"
          grep -E '^(newer|tag|image|digest)=' "$RUNNER_TEMP/qbittorrent-version-check.txt" >> "$GITHUB_OUTPUT"

  compatibility:
    needs: detect
    if: needs.detect.outputs.newer == 'true'
    outputs:
      integration_outcome: ${{ steps.integration.outcome }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      QBITCTL_NGINX_IMAGE: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
      NEW_IMAGE: ${{ needs.detect.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build compatibility binary
        run: go build -trimpath -o "$RUNNER_TEMP/qbitctl-compat" ./cmd/qbitctl
      - name: Pull pinned test images
        run: |
          docker pull "$QBITCTL_NGINX_IMAGE"
          docker pull "$NEW_IMAGE"
      - name: Exercise the new qBittorrent image
        id: integration
        continue-on-error: true
        env:
          NEW_TAG: ${{ needs.detect.outputs.tag }}
        run: |
          python3 scripts/integration_qbittorrent.py \
            --binary "$RUNNER_TEMP/qbitctl-compat" \
            --image "$NEW_IMAGE" \
            --version "$NEW_TAG"
      - name: Fail after recording integration outcome
        if: steps.integration.outcome == 'failure'
        run: exit 1

  report:
    needs: [detect, compatibility]
    if: always() && needs.detect.outputs.newer == 'true' && needs.compatibility.outputs.integration_outcome == 'failure'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open a tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_OUTCOME: ${{ needs.compatibility.outputs.integration_outcome }}
          NEW_TAG: ${{ needs.detect.outputs.tag }}
          NEW_IMAGE: ${{ needs.detect.outputs.image }}
          NEW_DIGEST: ${{ needs.detect.outputs.digest }}
        run: scripts/report_qbittorrent_compatibility.sh
