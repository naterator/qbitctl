name: Draft release assets

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build into a draft release
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a version tag such as 1.2.3 or v1.2.3."
            exit 1
          fi
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      # Keep release helpers tied to the workflow being run. This lets a
      # current workflow dispatch build an older tag without depending on
      # helper files that may not exist in that tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: |
            scripts/build.sh
            scripts/release_helpers.sh
          sparse-checkout-cone-mode: false
      # Release binaries build from scratch from the tagged source, never
      # from a cache written by an earlier workflow run.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run native tests
        run: |
          go vet ./...
          go test -race ./...
      - name: Require green CI for the release commit
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          . .release-workflow/scripts/release_helpers.sh
          release_wait_for_ci "$GITHUB_REPOSITORY" "$RELEASE_COMMIT"
        shell: bash
      - name: Build every release target
        run: VERSION="$RELEASE_TAG" bash .release-workflow/scripts/build.sh
      - name: Verify ARMv7 binary format
        run: file dist/qbitctl-linux-arm | grep -q 'ARM, EABI5'
      - name: Smoke release binary
        run: python3 scripts/smoke_native.py "./dist/qbitctl-$(go env GOOS)-$(go env GOARCH)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qbitctl-release-assets
          path: dist/qbitctl-*
          if-no-files-found: error

  upload:
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The source checkout in package may be an old manually selected tag;
      # use the workflow revision for the tag-integrity helper.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: scripts/release_helpers.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qbitctl-release-assets
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c qbitctl-*.sha256
      - name: Attach binaries to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          . .release-workflow/scripts/release_helpers.sh
          release_verify_tag_commit "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT"
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "::error::Release $RELEASE_TAG is already published. Use a new version tag."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/qbitctl-* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Assets are ready in the draft release. Enable repository release immutability before publishing."
        shell: bash
