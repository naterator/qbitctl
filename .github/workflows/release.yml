name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate tag and run native tests
        run: |
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          go vet ./...
          go test -race ./...
        shell: bash
      - name: Build every release target
        run: VERSION="$RELEASE_TAG" bash scripts/build.sh
      - name: Smoke release binary
        run: python3 scripts/smoke_native.py "./dist/qbitctl-$(go env GOOS)-$(go env GOARCH)"
      - uses: actions/upload-artifact@v6
        with:
          name: qbitctl-release-assets
          path: dist/qbitctl-*
          if-no-files-found: error

  upload:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: qbitctl-release-assets
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c qbitctl-*.sha256
      - name: Upload binaries to the user-created release
        run: gh release upload "$RELEASE_TAG" dist/qbitctl-* --repo "$GITHUB_REPOSITORY" --clobber
        shell: bash
